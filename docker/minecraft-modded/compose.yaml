services:
  minecraft-modded:
    image: itzg/minecraft-server:latest
    container_name: minecraft-modded
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.20.1"
      MEMORY: "5G"

      MODRINTH_PROJECTS: |
        fabric-api
        lithium
        modernfix
        jei:15.48.0.183
        timber-strike
        moonlight
        supplementaries
        ae2
        macaws-windows
        macaws-furniture
        macaws-stairs
        macaws-doors
        amendments
        ferrite-core
        cardinal-components-api
        travelersbackpack
        simple-hats
        accessories:1.0.0-beta.48+1.20.1
        create-fabric
        terralith
        yungs-api
        cloth-config
        yungs-better-dungeons
        yungs-bridges
        yungs-better-mineshafts
        yungs-better-strongholds

      MOTD: "Moose's Modded Experience"
      DIFFICULTY: "normal"
      MODE: "survival"
    volumes:
      - ./data:/data
    restart: unless-stopped
