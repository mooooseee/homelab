services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped

    ports:
      - "80:80" # Public HTTP Port
      - "81:81" # Adimn Web Port
      - "433:433" # Public HTTPS Port

    environment:
      DB_SQLITE_FILE: "/data/databse.sqlite"

    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

    networks:
      - homelab-network

networks:
  homelab-network:
    external: true
